        <main>
            <div class="contactForm">
                <h2>Contact Form</h2>
                <div class="form-content">
                    <form action="" method="post">
                        <label for="myName">Name:</label>
                        <input type="text" id="myName" name="myName" required>

                        <label for="myEmail">Email:</label>
                        <input type="email" id="myEmail" name="myEmail" required>

                        <label for="myContactReason">Contact Reason:</label>
                        <select name="myContactReason" id="myContactReason" required>
                            <option value="">Select a reason</option>
                            <option value="general">General Inquiry</option>
                            <option value="reservation">Crochet Support</option>
                            <option value="feedback">Feedback</option>
                        </select>

                        <label for="myComment">Comments:</label>
                        <textarea name="myComment" id="myComment" rows="4" required></textarea>

                        <button type="submit" class="submit-btn">Submit</button>
                    </form>

                    <div class="form-image">
                        <img src="yarnHappy.png" alt="HappyYarn">
                    </div>
                </div>
            </div>
